{{ if or .Values.secrets .Values.b64secrets .Values.vaultSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dotnet-app.fullname" . }}
  labels:
    {{- include "dotnet-app.labels" . | nindent 4 }}
type: Opaque
{{- if or .Values.secrets .Values.vaultSecrets }}
stringData:
  {{- if .Values.vaultSecrets }}
  VAULT__SECRETS__0: "YandexCloud/Common"
  {{- $index := 1 }}
  {{- range $path := .Values.vaultSecrets }}
  {{- if ne $path "YandexCloud/Common" }}
  {{ printf "VAULT__SECRETS__%d" $index }}: {{ $path | quote }}
  {{- $index = add $index 1 }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.b64secrets }}
data:
  {{- range $key, $value := .Values.b64secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
{{- end }}
